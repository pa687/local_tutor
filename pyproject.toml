[project]
name = "local-tutor"
version = "0.0.5"
description = "Fully local AI tutor for middle/high-school students (FastAPI + llama.cpp)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "sympy>=1.13",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: requires a running llama-server (Phase 1+)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

# ruff >= 0.16 also reformats the Python snippets inside Markdown code blocks.
# ENGINEERING_PLAN.md is the authoritative spec and must stay byte-identical to
# temp.md, so Markdown is out of scope for the formatter (and only for it: lint
# never reads .md).
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Dev-only benchmark helper: it shells out to nvidia-smi with a fixed argument list.
"scripts/bench_llama.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["backend/tutor", "tests"]
mypy_path = "backend"
strict = true

# SymPy ships no type information (no py.typed, no stubs), and §23.6 forbids adding
# dependencies just for typing — so its imports stay untyped and explicit ``str()``
# conversions guard the boundaries that matter.
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true
