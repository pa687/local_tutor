# Local Tutor configuration — ENGINEERING_PLAN.md §19
#
# Every value below can be overridden by an environment variable named
#   LOCAL_TUTOR__<SECTION>__<KEY>
# e.g. LOCAL_TUTOR__LLM__MODEL=qwen3.6-27b
# Values are parsed as YAML scalars, so `true`, `65536` and `qwen3.5-9b` all work.
#
# Never hardcode model paths or other absolute paths in Python code: put them here
# or in the environment (§1.5 / §23.6).

llm:
  base_url: http://127.0.0.1:8080
  model: qwen3.5-9b
  timeout: 180
  # Hybrid-thinking models (Qwen3.5) spend 20+ s of invisible reasoning before the
  # first visible token; measured 2026-09-11 on a grade-9 quadratic: thinking=false
  # gave TTFT 0.19 s, thinking=true 23.2 s, with no quality gain for a hint. Set to
  # true for hard problems — the classifier call never thinks, regardless.
  enable_thinking: false

tutor:
  default_mode: tutor
  max_verification_attempts: 2

memory:
  recent_turns: 30

retrieval:
  enabled: false
  top_k: 6
